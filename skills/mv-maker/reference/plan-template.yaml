# plan.yaml - the short way to write a footage MV storyboard (a few dozen lines instead of one entry per shot).
#   mv auto projects/<slug> --plan projects/<slug>/plan.yaml [--force]
# cuts the song into shots by section (from lyrics.yaml sections, else energy), shot length from the genre grammar
# (or `shot_len`), snapped to beats, and fills every shot from its section below. Lists cycle shot by shot.
# Everything except `sections`, `shots`, `performance` is copied to the storyboard top level.

title: "Mùa Hè Của Em"
genre: pop                     # genres.yaml: ballad pop kpop rap edm rock indie rnb
preset: pop-bright             # footage style preset (mv presets)
format: "9:16"
platforms: [tiktok, reels, youtube]
lang: vi
title_card: {artist: "Artist", title: "Mùa Hè Của Em"}
end_card: {text: "Artist", sub: "Official Music Video"}
cut_lead: 1f
performance: perf              # source id of the lip-synced performance clip: role `performance` shots use it
sources:                       # copied to the storyboard; `search` + `look_for` let mv scout find online footage
  perf: {note: "singer performing to the song (mv sync)"}
  drone: {search: ["drone beach town sunrise"], look_for: "aerial shot of a beach town at sunrise", orient: portrait}

sections:
  intro:
    look_for: ["aerial shot of a beach town at sunrise", "waves rolling onto sand, golden light"]
    role: [broll]
    size: [wide]
  verse:
    look_for: ["a young woman walking alone on a sunny street, from behind",
               "close-up of hands holding an old photograph",
               "bicycle passing a yellow wall, summer afternoon"]
    role: [narrative, performance, broll]
    size: [wide, medium, insert]
  pre:                         # pre-chorus / build
    look_for: ["friends running toward the sea, slow motion"]
    role: [narrative, performance]
    size: [medium, close]
    shot_len: 1.0
  chorus:
    look_for: ["friends laughing on the beach at golden hour", "jumping into the sea, splash, slow motion"]
    role: [performance, narrative, performance, broll]
    size: [medium, wide, close, insert]
    beat_fx: [zoom]
    transition: "zoom:0.3"
  chorus@last:                 # overrides for the last chorus (also `chorus@2`)
    shot_len: 0.8
    beat_fx: [zoom, flash]
  bridge:
    look_for: ["empty beach at dusk, a single footprint trail, black and white"]
    role: [narrative]
    size: [wide]
    fx: [bw, "grain:10"]
    transition: "fadeblack:0.6"
  outro:
    look_for: ["sun setting over the sea, silhouette waving goodbye"]
    role: [narrative]
    size: [wide]

shots:                         # optional fixes after expansion, by shot id
  S01: {layers: [{src: drone, in: 4.0}]}
