# Editing grammar per genre - read by `mv check` / `mv review` (storyboard: `genre: <name>`).
# Human guide with the reasoning: reference/genres.md.
#   asl          average shot length range per section, seconds [min, max]
#   performance  share of the section's time on performance shots (role: performance) [min, max]
#   min_shot     shortest shot that still reads (shorter = strobe; fine only as a deliberate burst)
#   cut_on       where cuts belong: beat | downbeat (every bar) | phrase (every 2-4 bars)
#   presets      style presets (presets.yaml) that fit the genre
# Section names in the storyboard are matched loosely: hook/refrain -> chorus, build/lift -> pre,
# rap -> verse, break -> bridge (see editcheck.py CANON).

ballad:
  name: "Ballad / slow love song / V-pop ballad"
  presets: [cinematic-ballad, wedding-romance]
  min_shot: 1.2
  cut_on: downbeat
  asl: {intro: [3, 8], verse: [2.5, 5], pre: [2, 4], chorus: [1.5, 3.5], bridge: [3, 7], outro: [3, 10]}
  performance: {verse: [0.25, 0.6], chorus: [0.35, 0.75], bridge: [0.1, 0.6]}

pop:
  name: "Pop / V-pop / dance-pop"
  presets: [pop-bright, tiktok-remix]
  min_shot: 0.5
  cut_on: beat
  asl: {intro: [1.5, 4], verse: [1.5, 3], pre: [1, 2], chorus: [0.8, 2], bridge: [2, 4], outro: [2, 6]}
  performance: {verse: [0.3, 0.7], chorus: [0.5, 0.9], bridge: [0.1, 0.6]}

kpop:
  name: "K-pop / idol / choreography"
  presets: [kpop-stage, pop-bright]
  min_shot: 0.35
  cut_on: beat
  asl: {intro: [1, 3], verse: [1, 2.5], pre: [0.7, 1.6], chorus: [0.5, 1.5], drop: [0.4, 1.2], bridge: [1.5, 3.5], outro: [1.5, 5]}
  performance: {verse: [0.5, 0.9], chorus: [0.6, 0.95], drop: [0.6, 1.0], bridge: [0.2, 0.7]}

rap:
  name: "Rap / hip-hop / trap"
  presets: [rap-kinetic, tiktok-remix]
  min_shot: 0.3
  cut_on: beat
  asl: {intro: [1, 4], verse: [0.8, 2.5], pre: [0.6, 1.5], chorus: [0.5, 1.5], bridge: [1.5, 3.5], outro: [1.5, 5]}
  performance: {verse: [0.5, 0.9], chorus: [0.4, 0.85]}

edm:
  name: "EDM / house / club"
  presets: [edm-neon, tiktok-remix]
  min_shot: 0.25
  cut_on: beat
  asl: {intro: [2, 6], verse: [1.5, 3], pre: [0.6, 2], drop: [0.25, 1.0], chorus: [0.4, 1.2], bridge: [2, 5], outro: [2, 8]}
  performance: {drop: [0.0, 0.5], chorus: [0.0, 0.5]}

rock:
  name: "Rock / punk / band"
  presets: [rock-grunge, rap-kinetic]
  min_shot: 0.3
  cut_on: beat
  asl: {intro: [1.5, 4], verse: [1.2, 3], pre: [0.8, 2], chorus: [0.6, 1.5], bridge: [1.5, 4], outro: [1.5, 6]}
  performance: {verse: [0.5, 0.9], chorus: [0.6, 0.95], bridge: [0.2, 0.8]}

indie:
  name: "Indie / acoustic / lo-fi / folk"
  presets: [lofi-chill, vintage-90s]
  min_shot: 1.5
  cut_on: phrase
  asl: {intro: [4, 10], verse: [3, 8], pre: [2.5, 5], chorus: [2, 5], bridge: [3, 8], outro: [4, 12]}
  performance: {verse: [0.1, 0.6], chorus: [0.2, 0.7]}

rnb:
  name: "R&B / soul / neo-soul"
  presets: [rnb-night, cinematic-ballad]
  min_shot: 0.8
  cut_on: downbeat
  asl: {intro: [2.5, 6], verse: [2, 4], pre: [1.5, 3], chorus: [1.2, 2.5], bridge: [2, 5], outro: [3, 8]}
  performance: {verse: [0.4, 0.8], chorus: [0.4, 0.85]}
