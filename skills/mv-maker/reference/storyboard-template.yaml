# storyboard.yaml - single source of truth for the MV. The user approves it (via storyboard.md + animatic)
# BEFORE any footage is downloaded. Field reference: reference/storyboard-schema.md
# Technique IDs: reference/techniques.md. Write the text fields in the user's language and set `lang`.
title: "Song Title - MV"
slug: my-song
lang: en                    # labels of storyboard.md: en | vi
audio: audio/song.mp3
format: "9:16"
fps: 30
song_start: 0
fade_out: 1.2
audio_fade_out: 0
caption_anim: fade

concept: |
  A journey through a door back into memory: from the present (stage, fans) back to the days of
  playing the piano, until the chorus fuses present and past into one.

song_reading: |
  - Theme: missing the early days, gratitude to the people who came along.
  - Emotional arc: curious intro → nostalgic verse → bursting, warm chorus → quiet ending.
  - Key lines: the opening line (the door opens) and the chorus hook.

look: |
  Palette: warm film (L-WARM-FILM) for memories, bright glow (L-GLOW) for the stage.
  Signature technique: C-SPLIT-SOFT - singer on top, fans below, the halves melting together.
  Motif (S-MOTIF): the door - opens at the start of the MV, closes at the end.

technique_plan:
  - section: Intro
    time: "0:00-0:04"
    meaning: "Stepping into the story"
    recommend: "S-HOOK-3S + zoom-in flight to the door + X-CIRCLE/flash on the first sung syllable"
    why: "Door opening = opening the memory; a flash right on the first line holds TikTok viewers in the first 3 s"
    options: ["X-MATCH-CUT: hand pushes the door → cut to an old scene of a door opening", "C-FIT-BLUR if the flight shot is 16:9"]
  - section: Verse 1
    time: "0:04-0:15"
    meaning: "Reminiscing, playing the piano long ago"
    recommend: "L-WARM-FILM + C-DOUBLE-EXPO (keepsake photo overlay) → C-SPLIT-SOFT singer/fans"
    why: "The lyrics tell an old story, so the image is soft and warm; the soft split = present and memory touching"
    options: ["L-VHS for a 90s home-video feel", "C-PIP: big stage, old scene in the corner"]
  - section: Chorus
    time: "0:15-0:20"
    meaning: "Explosion, a sea of lightsticks"
    recommend: "R-FLASH-DROP into the chorus + R-ZOOM-PULSE + R-BEAT-FLASH + K-POP"
    why: "Lightsticks blink on the beat - make the frame pulse with it like being at the concert"
    options: ["Softer: only R-BEAT-CUT + L-GLOW", "Punchier: add R-SHAKE for the first 2 s"]
  - section: Outro
    time: "0:20-0:24"
    meaning: "Settling down, gratitude"
    recommend: "R-SLOWMO + L-GLOW + K-TITLE + X-DIP-BLACK"
    why: "A slow ending lets the last line linger"
    options: ["S-MOTIF: the door closes instead of the fans shot"]

wow_moments:
  - "0:04 - the door opens + white flash exactly on the first syllable"
  - "0:15 - into the chorus: flash + zoom pulses on every beat over the sea of lightsticks"

sources:
  door_fly:
    search: "drone fly through door FPV"
    note: "Camera flies straight at a door that opens"
    rights: "to verify"
  old_piano:
    note: "Old footage: someone playing the piano, old film look"
  singer_live:
    note: "Singer performing live, close-up"
    # url: https://www.youtube.com/watch?v=XXXX
    # section: "1:20-2:40"   # `in` below still uses ORIGINAL video time
  fans_light:
    note: "Fans waving lightsticks to the beat"
  memory_overlay:
    note: "Keepsake photo/clip to overlay"

shots:
  - id: S01
    start: 0
    end: 4.0
    section: intro
    intent: "Camera rushes at the door, the door opens on the first sung line"
    technique: [S-HOOK-3S, X-DIP-WHITE]
    layout: full
    layers:
      - {src: door_fly, in: 0, zoom: in, fx: [warm]}
    transition: flash
    alt: ["X-MATCH-CUT to an old scene where a door also opens"]

  - id: S02
    start: 4.0
    end: 9.0
    lyric: "lyric line 1"
    intent: "Memories flood back: piano playing, old photo overlay"
    technique: [L-WARM-FILM, C-DOUBLE-EXPO, K-RISE]
    layout: full
    layers:
      - {src: old_piano, in: 0, fx: [vintage, grain], zoom: in}
      - {src: memory_overlay, in: 0, blend: screen, opacity: 0.35, fx: [blur:8]}
    caption: "lyric line 1"
    caption_anim: rise
    transition: dissolve:0.6
    alt: ["L-VHS instead of warm film"]

  - id: S03
    start: 9.0
    end: 15.0
    lyric: "lyric line 2 (nostalgic)"
    intent: "Top: singer sings · Bottom: fans waving lightsticks, the halves melting together"
    technique: [C-SPLIT-SOFT, S-CALL-RESPONSE, L-GLOW]
    layout: split_v          # soft seam (feather 0.2) by default
    layers:
      - {src: singer_live, in: 0, focus: [0.5, 0.35]}
      - {src: fans_light, in: 0, fx: [glow]}
    fx: [grain:8]
    caption: "lyric line 2"
    transition: fadewhite:0.5
    alt: ["Top half blurred and warm (memory) - fx: [blur:10, warm]", "C-SPLIT-HARD (feather: 0) for contrast"]

  - id: S04
    start: 15.0
    end: 20.0
    lyric: "chorus"
    intent: "Sea of lightsticks, the frame pulses on the beat"
    technique: [R-FLASH-DROP, R-ZOOM-PULSE, R-BEAT-FLASH, K-POP]
    layout: fit_blur
    layers:
      - {src: singer_live, in: 30}
    beat_fx: [zoom, flash]
    beat_every: 1
    caption: "chorus hook line"
    caption_anim: pop
    transition: dissolve:0.6
    alt: ["C-PIP: big stage + old scene in the corner", "Add R-SHAKE for the first 2 s"]

  - id: S05
    start: 20.0
    end: 24.0
    intent: "Ending: slow down, fade to black"
    technique: [R-SLOWMO, L-GLOW, K-TITLE]
    layout: full
    layers:
      - {src: fans_light, in: 20, speed: 0.5, fx: [glow, warm]}
    caption: "Song Title · Artist"
    caption_style: title
    caption_anim: rise

captions: []
